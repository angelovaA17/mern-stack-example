name: Docker CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-backend ./mern/server

      - name: Build frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend ./mern/client

      - name: Push backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend

      - name: Push frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mern-frontend