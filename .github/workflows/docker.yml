name: Docker CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: angelovaA17
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./mern/server
          push: true
          tags: angelovaA17/mern-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./mern/client
          push: true
          tags: angelovaA17/mern-frontend:latest