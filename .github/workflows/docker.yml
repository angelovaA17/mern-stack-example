name: Docker CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Debug (да видиме дали username постои)
      - name: Debug username
        run: echo "USER=${{ secrets.DOCKER_USERNAME }}"

      # 3. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build backend (ВАЖНО: има PATH на крај)
      - name: Build backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest ./mern/server

      # 5. Build frontend
      - name: Build frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:latest ./mern/client

      # 6. Push backend
      - name: Push backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest

      # 7. Push frontend
      - name: Push frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mern-frontend:latest