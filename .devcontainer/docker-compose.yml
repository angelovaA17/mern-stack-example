services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ../mern/server
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file:
      - ../mern/server/config.env
    environment:
      - ATLAS_URI=mongodb://mongo:27017/mern-app
    command: npm start

  frontend:
    build: ../mern/client
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev

volumes:
  mongo-data: